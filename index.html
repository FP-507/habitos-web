<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Racha · Registro de hábitos</title>
  <meta name="description" content="Registra tus hábitos diarios, mira tus rachas y tu progreso de las últimas 12 semanas.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <header class="cabecera">
      <div>
        <p class="eyebrow" id="fecha-hoy"></p>
        <h1>Racha</h1>
      </div>
      <dl class="resumen" aria-label="Resumen de hoy">
        <div><dt>Hoy</dt><dd id="resumen-hoy">0/0</dd></div>
        <div><dt>Mejor racha activa</dt><dd id="resumen-racha">0</dd></div>
      </dl>
    </header>

    <form id="form-nuevo" class="form-nuevo" autocomplete="off">
      <label for="nombre" class="sr-only">Nuevo hábito</label>
      <input id="nombre" name="nombre" maxlength="40" placeholder="Nuevo hábito, p. ej. «Leer 20 minutos»" required>
      <fieldset class="colores" aria-label="Color">
        <legend class="sr-only">Color</legend>
      </fieldset>
      <button type="submit" class="btn btn-primario">Agregar</button>
    </form>
    <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>

    <section id="lista" class="lista" aria-label="Tus hábitos"></section>

    <section id="vacio" class="vacio" hidden>
      <p class="vacio-titulo">Todavía no tienes hábitos.</p>
      <p>Agrega uno arriba y márcalo cada día que lo cumplas. Los datos se guardan solo en este navegador.</p>
    </section>

    <footer class="pie">
      <button type="button" class="btn btn-texto" id="exportar">Exportar JSON</button>
      <label class="btn btn-texto" for="importar">Importar JSON</label>
      <input type="file" id="importar" accept="application/json" hidden>
    </footer>
  </main>

  <template id="tpl-habito">
    <article class="habito">
      <div class="habito-cabecera">
        <h2 class="habito-nombre"></h2>
        <button type="button" class="btn-borrar" aria-label="Borrar hábito">×</button>
      </div>
      <div class="habito-stats">
        <span><strong class="stat-racha"></strong> <span class="txt-racha"></span></span>
        <span><strong class="stat-mejor"></strong> mejor</span>
        <span><strong class="stat-pct"></strong>% en 30 días</span>
      </div>
      <div class="semana" role="group" aria-label="Últimos 7 días"></div>
      <p class="mapa-titulo">Últimas 12 semanas</p>
      <div class="mapa" aria-hidden="true"></div>
    </article>
  </template>

  <script type="module" src="src/app.js"></script>
</body>
</html>
